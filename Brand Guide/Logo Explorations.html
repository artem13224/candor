<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Candor — Logo Explorations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@300;400;500;600;700;800;900&family=Open+Sans:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&family=Fraunces:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

<style>
  :root {
    --oat: #ECEAE2;
    --paper: #F5F3EE;
    --ink: #0D1610;
    --forest: #2D6B42;
    --forest-2: #3D8A57;
    --body: #4A5548;
    --rule: #C8C3B5;
  }

  body { background: #f0eee9; margin: 0; font-family: 'Open Sans', sans-serif; }

  /* artboard inner — one slate per direction */
  .lab {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-rows: 1fr 1fr auto;
    background: var(--paper);
    overflow: hidden;
  }
  .stage {
    display: grid;
    place-items: center;
    padding: 24px;
    border-bottom: 1px solid var(--rule);
  }
  .stage.light { background: var(--paper); }
  .stage.oat   { background: var(--oat); }
  .stage.dark  { background: var(--ink); }
  .stage.green { background: var(--forest); }

  .smallrow {
    background: var(--paper);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-top: 1px solid var(--rule);
  }
  .small-left { display: flex; align-items: center; gap: 12px; }
  .mono {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--body);
  }
  .pin {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--forest);
    padding: 4px 8px;
    background: rgba(45,107,66,0.08);
    border-radius: 2px;
  }

  /* generic wordmark helpers used inline */
  .wm-urb { font-family: 'Urbanist', sans-serif; font-weight: 800; letter-spacing: -0.045em; line-height: 0.9; }
  .wm-fr  { font-family: 'Fraunces', serif; font-weight: 600; letter-spacing: -0.035em; line-height: 0.92; }
  .wm-mono { font-family: 'Space Mono', monospace; letter-spacing: 0.04em; }
  .wm-isr { font-family: 'Instrument Serif', serif; font-style: italic; letter-spacing: -0.01em; }

  /* board-level banner */
  .banner {
    position: fixed; top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(13, 22, 16, 0.94);
    color: var(--paper);
    padding: 14px 28px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(245,243,238,0.1);
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    backdrop-filter: blur(8px);
  }
  .banner .title { font-family: 'Urbanist', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: -0.01em; text-transform: none; }
  .banner .right { color: rgba(245,243,238,0.6); }
  .banner a { color: var(--forest-2); text-decoration: none; border-bottom: 1px solid rgba(61,138,87,0.4); }

  /* nudge canvas down so banner doesn't overlap top sections */
  body > div[data-dc-canvas] { padding-top: 56px; }
</style>
</head>
<body>

<div class="banner">
  <span class="title">Candor — Logo Explorations · Round 6</span>
  <span class="right">Dual-plane topographic illustration · ref recreation</span>
  <a href="Brand Guide.html">← back to brand guide</a>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="logo-options.jsx"></script>

<div id="root"></div>

<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<LogoBoard />);
</script>

</body>
</html>
