<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#ECEAE2;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:40px}
.cell{background:#F5F3EE;display:grid;place-items:center;padding:40px}
.cell.dark{background:#0D1610}
.label{font:11px/1 'Space Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:#2D6B42;margin-bottom:20px}
img{width:240px;height:240px}
</style></head><body>
<div>
  <div class="cell"><div><div class="label">Alternating (4 rings)</div><img src="user-mark-alt.svg"/></div></div>
</div>
<div>
  <div class="cell dark"><div><div class="label" style="color:#3D8A57">Alternating on ink</div><img src="user-mark-alt.svg"/></div></div>
</div>
</body></html>
