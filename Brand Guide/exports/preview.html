<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@800&display=swap" rel="stylesheet"/>
<style>
body{margin:0;background:#ECEAE2;font-family:'Space Mono',monospace;padding:60px;display:flex;flex-direction:column;gap:40px}
.row{display:flex;align-items:center;gap:24px;background:#F5F3EE;padding:32px;border:1px solid #C8C3B5}
.row .label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#2D6B42;min-width:160px}
img{display:block;background:transparent}
.dark{background:#0D1610}
.dark .label{color:#3D8A57}
</style></head>
<body>
<div class="row"><div class="label">Mark only</div><img src="Candor-mark.svg" width="160"/></div>
<div class="row"><div class="label">Primary lockup</div><img src="Candor-lockup.svg" width="540"/></div>
<div class="row dark"><div class="label">Lockup on ink</div><img src="Candor-lockup.svg" width="540"/></div>
</body></html>
