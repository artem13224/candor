
<style>
@keyframes dotPop{0%{transform:scale(0);opacity:0}65%{transform:scale(1.4);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes ringPulse{0%{transform:scale(1);opacity:.6}100%{transform:scale(4);opacity:0}}
#dot,#dot-ring{transform-box:fill-box;transform-origin:center}
#replay{background:transparent;border:0.5px solid rgba(245,243,238,0.25);border-radius:40px;color:rgba(245,243,238,0.45);font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:10px 28px;cursor:pointer;transition:opacity .4s ease,background .2s ease}
#replay:hover{background:rgba(245,243,238,0.07)}
</style>

<div id="stage" style="background:#0D1610;min-height:500px;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:12px;overflow:hidden;user-select:none;">

  <div id="mark-wrap" style="width:210px;height:151px;opacity:0;transform:scale(0.91);transition:opacity .6s ease,transform .6s ease;">
    <svg id="lsvg" viewBox="0 0 318.09 228.49" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible">
      <path d="M317.78,114.7c5.13,58.78-55.13,92.95-104.46,106.03-52.16,13.84-109.97,9.36-158.44-14.89C26.75,191.7,2.22,165.83.21,133.08c-1.93-27.64,9.72-54.51,24.88-77.04,14.39-21.2,34.99-38.54,59.16-47.38,42.18-15.78,88.35-7.24,130.64,3.83,53.37,14.34,100.53,40.86,102.89,102.05v.17h0Z" fill="#0d1610"/>
      <path id="r1" d="M277.02,105.23c11.14,65.3-91.48,105.45-143.3,96.47-41.63-6.39-67.99-44.63-77.8-82.84-12.27-41.61,20.46-81.5,59.84-92.24,28.29-8.96,59.78-4.52,86.28,7.76,29.65,14.63,68.91,30.87,74.98,70.85Z" fill="none" stroke="#F5F3EE" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.8"/>
      <path id="r2" d="M234.88,110.42c-.9,12-9.27,25.3-19.12,34.4-15.51,14.36-36.52,23.05-57.76,24.2-22.86,1.15-44.01-8.83-54-29.92-5.74-12.41-10.57-27.81-8.28-41.48,2.66-16.33,16.88-27.62,31.28-34.12,16.85-7.68,35.85-11.88,54.44-9.48,20.71,2.64,40.9,15.33,48.84,35,2.78,6.87,5.5,9.4,4.6,21.4h0Z" fill="none" stroke="#F5F3EE" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.8"/>
      <path id="r3" d="M208.28,102.04c-.78,8.99-6.66,16.34-14.5,21.5-11.97,7.77-28.52,8.76-41.54,2.93-11.21-4.79-20.29-17.1-16.39-29.46,3.42-10.5,13.59-15.89,23.96-19.28,12.09-3.77,26.07-5.19,36.83,1.94,7.24,4.8,12.41,13.4,11.66,22.18v.18h-.02Z" fill="none" stroke="#F5F3EE" stroke-linecap="round" stroke-linejoin="round" stroke-width="8.8"/>
      <g transform="translate(172.48,101.58)">
        <circle id="dot-ring" cx="0" cy="0" r="8" fill="none" stroke="#3d8a57" stroke-width="1.5" opacity="0"/>
        <circle id="dot" cx="0" cy="0" r="5.5" fill="#3d8a57" opacity="0"/>
      </g>
    </svg>
  </div>

  <div id="wordmark" style="margin-top:26px;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;font-weight:800;font-size:50px;letter-spacing:-2.5px;color:#F5F3EE;opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s ease;">Candor</div>

  <div id="tagline" style="margin-top:7px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-weight:300;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:#F5F3EE;opacity:0;transition:opacity .6s ease;">Sustainability certification · Vancouver</div>

  <div style="margin-top:52px;height:36px;display:flex;align-items:center;">
    <button id="replay" style="opacity:0;transition:opacity .5s ease">Replay</button>
  </div>
</div>

<script>
const mark = document.getElementById('mark-wrap');
const wm = document.getElementById('wordmark');
const tl = document.getElementById('tagline');
const rb = document.getElementById('replay');
const dot = document.getElementById('dot');
const dr = document.getElementById('dot-ring');
const rings = [document.getElementById('r1'),document.getElementById('r2'),document.getElementById('r3')];
let timers = [];

function q(fn,ms){timers.push(setTimeout(fn,ms));}

function init(){
  rings.forEach(r=>{
    const len=r.getTotalLength();
    r.style.strokeDasharray=len;
    r.style.strokeDashoffset=len;
    r.style.transition='none';
  });
  mark.style.opacity='0';
  mark.style.transform='scale(0.91)';
  mark.style.transition='none';
  wm.style.opacity='0';
  wm.style.transform='translateY(14px)';
  wm.style.transition='none';
  tl.style.opacity='0';
  tl.style.transition='none';
  rb.style.opacity='0';
  dot.style.animation='none';
  dot.setAttribute('opacity','0');
  dr.style.animation='none';
  dr.setAttribute('opacity','0');
}

function run(){
  timers.forEach(clearTimeout);
  timers=[];
  init();

  q(()=>{
    mark.style.transition='opacity .6s ease,transform .6s ease';
    mark.style.opacity='1';
    mark.style.transform='scale(1)';
  },120);

  q(()=>{
    r1.style.transition='stroke-dashoffset 1.1s cubic-bezier(.37,0,.2,1)';
    r1.style.strokeDashoffset='0';
  },580);

  q(()=>{
    r1.style.opacity='.7';
    r2.style.transition='stroke-dashoffset .95s cubic-bezier(.37,0,.2,1)';
    r2.style.strokeDashoffset='0';
  },1120);

  q(()=>{
    r2.style.opacity='.75';
    r3.style.transition='stroke-dashoffset .85s cubic-bezier(.37,0,.15,1)';
    r3.style.strokeDashoffset='0';
  },1650);

  q(()=>{
    r1.style.transition='opacity .4s ease';
    r2.style.transition='opacity .4s ease';
    r3.style.transition='opacity .4s ease';
    r1.style.opacity='1';
    r2.style.opacity='1';
    r3.style.opacity='1';
  },2300);

  q(()=>{
    dot.style.animation='dotPop .55s cubic-bezier(.34,1.56,.64,1) forwards';
    dot.setAttribute('opacity','1');
  },2280);

  q(()=>{
    dr.setAttribute('opacity','.6');
    dr.style.animation='ringPulse .9s ease-out forwards';
  },2600);

  q(()=>{
    wm.style.transition='opacity .7s ease,transform .7s ease';
    wm.style.opacity='1';
    wm.style.transform='translateY(0)';
  },2900);

  q(()=>{
    tl.style.transition='opacity .6s ease';
    tl.style.opacity='.45';
  },3350);

  q(()=>{rb.style.opacity='1';},4300);
}

const r1=rings[0],r2=rings[1],r3=rings[2];
rb.addEventListener('click',e=>{e.stopPropagation();rb.style.opacity='0';setTimeout(run,300);});
run();
</script>
