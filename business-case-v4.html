<!DOCTYPE html>
<html lang="en" style="background:#0D1610">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:ital,wght@0,300;0,400;0,700;0,800;0,900;1,300&family=Open+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#ECEAE2;--dk:#0D1610;
  --ink:#0E110D;--ink3:#4A5548;--ink4:#5E6E5E;
  --green:#2D6B42;--green2:#3D8A57;--white:#F5F3EE;
  --u:'Urbanist',sans-serif;--o:'Open Sans',sans-serif;
}
html,body{background:var(--dk);color:var(--white);font-family:var(--o);-webkit-font-smoothing:antialiased}

/* ── OUTER ── */
.bc-outer{position:relative}

/* ── STICKY ── */
.bc-sticky{
  position:sticky;top:0;height:100vh;
  display:grid;grid-template-columns:1fr 1fr;
  overflow:hidden;
}

/* ── LEFT ── */
.bc-left{
  padding:clamp(40px,5vh,72px) clamp(28px,5vw,80px);
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;z-index:2;
}

.bc-ey{
  font-family:var(--u);font-size:11px;font-weight:500;
  letter-spacing:.22em;text-transform:uppercase;
  color:rgba(245,243,238,.4);
  display:flex;align-items:center;gap:10px;
}
.bc-ey::before{content:'';width:18px;height:1.5px;background:var(--green2);flex-shrink:0}

.bc-mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:0;padding:28px 0}

/* TAG */
.bc-tag-row{margin-bottom:18px;height:16px;position:relative;overflow:hidden}
.bc-tag{
  font-family:var(--u);font-size:10.5px;font-weight:600;
  letter-spacing:.2em;text-transform:uppercase;color:var(--green2);
  display:flex;
}
.bc-tag .fc{display:inline-block;transform-origin:50% 50%;will-change:transform,opacity}

/* STAT */
.bc-stat-row{
  margin-bottom:16px;
  overflow:visible;position:relative;
}
.bc-stat{
  font-family:var(--u);font-weight:800;
  font-size:clamp(64px,10vw,122px);
  line-height:.92;letter-spacing:-.04em;
  color:var(--white);
  display:flex;flex-wrap:wrap;
}
.bc-stat .fc{
  display:inline-block;
  transform-origin:50% 0%;
  will-change:transform,opacity;
  backface-visibility:hidden;
}

/* RULE */
.bc-rule{height:1.5px;background:var(--green);margin-bottom:18px;transform-origin:left}

/* TITLE */
.bc-title-row{margin-bottom:12px;overflow:hidden}
.bc-title{
  font-family:var(--u);font-weight:700;
  font-size:clamp(17px,1.9vw,24px);
  letter-spacing:-.015em;line-height:1.2;
  color:var(--white);
  display:flex;flex-wrap:wrap;
}
.bc-title .fc{display:inline-block;transform-origin:50% 0%;will-change:transform,opacity}

/* BODY */
.bc-body-row{max-width:440px}
.bc-body{
  font-family:var(--o);font-size:clamp(13px,1.2vw,15px);
  line-height:1.68;font-weight:300;color:rgba(245,243,238,.58);
  display:flex;flex-wrap:wrap;
}
.bc-body .fw{display:inline;margin-right:.26em}

/* SRC */
.bc-src{
  font-family:var(--u);font-size:9.5px;font-weight:500;
  letter-spacing:.12em;text-transform:uppercase;
  color:rgba(245,243,238,.28);margin-top:10px;display:block;
}

/* BOTTOM */
.bc-bot{display:flex;align-items:center;justify-content:space-between;gap:20px}
.bc-prog{flex:1;height:1px;background:rgba(245,243,238,.12);position:relative;overflow:hidden}
.bc-prog-fill{position:absolute;left:0;top:0;height:100%;background:var(--green2);width:0%}
.bc-num{font-family:var(--u);font-size:11px;font-weight:500;letter-spacing:.14em;color:rgba(245,243,238,.35)}
.bc-num strong{font-weight:800;color:var(--white)}

/* ── RIGHT ── */
.bc-right{
  position:relative;overflow:hidden;
}
/* Canvas for image animation */
#bcCanvas{
  position:absolute;inset:0;width:100%;height:100%;
}

/* ── MOBILE ── */
@media(max-width:767px){
  .bc-outer{height:auto!important}
  .bc-sticky{position:static;height:auto;grid-template-columns:1fr}
  .bc-right{min-height:50vw}
  #bcCanvas{position:relative;width:100%;height:50vw}
  .bc-stat .fc,.bc-title .fc,.bc-tag .fc{transform:none!important;opacity:1!important}
  .bc-body .fw{display:inline}
}
::selection{background:var(--green);color:var(--white)}
</style>
</head>
<body>

<div class="bc-outer" id="bcOuter">
  <div class="bc-sticky" id="bcSticky">

    <div class="bc-left">
      <div class="bc-ey">02 — The business case</div>

      <div class="bc-mid">
        <div class="bc-tag-row">
          <div class="bc-tag" id="bcTag"></div>
        </div>

        <div class="bc-stat-row">
          <div class="bc-stat" id="bcStat"></div>
        </div>

        <div class="bc-rule" id="bcRule"></div>

        <div class="bc-title-row">
          <div class="bc-title" id="bcTitle"></div>
        </div>

        <div class="bc-body-row">
          <div class="bc-body" id="bcBody"></div>
          <span class="bc-src" id="bcSrc"></span>
        </div>
      </div>

      <div class="bc-bot">
        <div class="bc-prog"><div class="bc-prog-fill" id="bcFill"></div></div>
        <div class="bc-num"><strong id="bcCurr">01</strong> / 04</div>
      </div>
    </div>

    <div class="bc-right">
      <canvas id="bcCanvas"></canvas>
    </div>

  </div>
</div>

<script>
(function(){
'use strict';

/* ══════════════════════════════════════
   DATA
══════════════════════════════════════ */
const PANELS = [
  {
    bg:'#0D1610',
    tag:'Revenue',
    stat:'14%',
    title:'Faster growth. Not a rounding error.',
    body:'Certified businesses grow revenue 14% faster. Not because customers pay more — because certification opens retail listings, procurement shortlists, and press that the uncertified brand never gets invited to.',
    src:'— Deloitte Global, 2023',
    imgs:[
      {url:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1536819827997-9d4cec1ca9a4?w=500&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1448375240586-882707db888b?w=500&q=80&auto=format&fit=crop'},
    ]
  },
  {
    bg:'#ECEAE2',
    tag:'Retention',
    stat:'50%',
    title:"Half the turnover. The math isn't subtle.",
    body:"Certified workplaces lose staff at half the rate of uncertified ones. The cert signals that values are verified — not just a line on the website. Replacing one employee costs 50–200% of their salary.",
    src:'— Great Place to Work, 2023',
    imgs:[
      {url:'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=600&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1522163182402-834f871fd851?w=500&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=500&q=80&auto=format&fit=crop'},
    ]
  },
  {
    bg:'#0D1610',
    tag:'Legal exposure',
    stat:'C-59',
    title:'Your packaging copy is now a legal document.',
    body:"Canada's amended Competition Act penalises environmental claims that can't be substantiated by a third party. 'Eco-friendly.' 'Sustainably sourced.' Every one of those is a liability without a cert.",
    src:'— Competition Act amendment, 2024',
    imgs:[
      {url:'https://images.unsplash.com/photo-1556228720-195a672e8a03?w=600&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=500&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1536819827997-9d4cec1ca9a4?w=500&q=80&auto=format&fit=crop'},
    ]
  },
  {
    bg:'#ECEAE2',
    tag:'Retail access',
    stat:'MEC · REI',
    title:'The listing goes to whoever has it.',
    body:"MEC, REI, and Whole Foods are adding sustainability disclosures to new supplier conversations. You could have the best product and still lose the listing to a competitor who got certified first.",
    src:'— Retail buyer conversations, 2024–25',
    imgs:[
      {url:'https://images.unsplash.com/photo-1522163182402-834f871fd851?w=600&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=500&q=80&auto=format&fit=crop'},
      {url:'https://images.unsplash.com/photo-1448375240586-882707db888b?w=500&q=80&auto=format&fit=crop'},
    ]
  },
];

/* ══════════════════════════════════════
   CANVAS IMAGE SYSTEM
══════════════════════════════════════ */
const canvas = document.getElementById('bcCanvas');
const ctx    = canvas.getContext('2d');

/* Pre-load all images */
const allUrls = [...new Set(PANELS.flatMap(p => p.imgs.map(i => i.url)))];
const imgCache = {};
let loadedCount = 0;

allUrls.forEach(url => {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => { imgCache[url] = img; loadedCount++; renderFrame(); };
  img.src = url;
});

/* Per-panel image card layout — pre-computed random layouts */
function makeLayout(panelIdx, count, W, H){
  /* Seeded-ish randomness using panelIdx so it's stable */
  const seed = (panelIdx * 7919 + 13) % 100;
  const r = (n) => ((seed * (n+1) * 31337) % 100) / 100;

  const layouts = [];
  const cx = W / 2, cy = H / 2;
  const spread = Math.min(W, H) * 0.32;

  for(let i = 0; i < count; i++){
    const angle  = (i / count) * Math.PI * 2 + r(i*3) * 0.8;
    const dist   = spread * (0.35 + r(i*5+1) * 0.55);
    const rot    = (r(i*7+2) - 0.5) * 24; /* -12 to +12 deg */
    const scale  = 0.7 + r(i*11+3) * 0.45;
    /* Wider cards get landscape, taller get portrait */
    const landscape = r(i*13+4) > 0.5;

    layouts.push({
      x:      cx + Math.cos(angle) * dist,
      y:      cy + Math.sin(angle) * dist * 0.75,
      rot:    rot * Math.PI / 180,
      scale:  scale,
      w:      landscape ? 180 : 120,
      h:      landscape ? 120 : 162,
      /* exit trajectory — flies out in a random direction */
      exitAngle: (r(i*17+5)) * Math.PI * 2,
      exitSpin:  (r(i*19+6) - 0.5) * 3,
    });
  }
  return layouts;
}

/* Canvas draw */
let canvasW = 0, canvasH = 0;
const layoutCache = {};

function resizeCanvas(){
  canvasW = canvas.offsetWidth;
  canvasH = canvas.offsetHeight;
  canvas.width  = canvasW * window.devicePixelRatio;
  canvas.height = canvasH * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  layoutCache[0] = makeLayout(0, PANELS[0].imgs.length, canvasW, canvasH);
  PANELS.forEach((_,i) => {
    layoutCache[i] = makeLayout(i, PANELS[i].imgs.length, canvasW, canvasH);
  });
}

function drawImage(img, layout, alpha, progress, exiting){
  if(!img || alpha <= 0) return;

  const {x, y, rot, scale, w, h, exitAngle, exitSpin} = layout;

  let cx = x, cy = y, r = rot, sc = scale, op = alpha;

  if(exiting){
    /* Fly out: scatter away from center */
    const flyDist = progress * canvasW * 0.65;
    cx += Math.cos(exitAngle) * flyDist;
    cy += Math.sin(exitAngle) * flyDist * 0.7;
    r  += exitSpin * progress;
    sc *= (1 - progress * 0.18);
    op *= Math.max(0, 1 - progress * 2.2);
  } else {
    /* Fly in: arrive from outside */
    const flyDist = (1 - progress) * canvasW * 0.65;
    cx += Math.cos(exitAngle + Math.PI) * flyDist;
    cy += Math.sin(exitAngle + Math.PI) * flyDist * 0.7;
    r  -= exitSpin * (1 - progress);
    sc *= (0.6 + progress * 0.4);
    op *= Math.min(1, progress * 2.2);
    /* Overshoot + settle */
    const settle = progress > 0.8
      ? Math.sin((progress - 0.8) / 0.2 * Math.PI) * 6
      : 0;
    cy += settle;
  }

  ctx.save();
  ctx.globalAlpha = Math.max(0, Math.min(1, op));
  ctx.translate(cx, cy);
  ctx.rotate(r);
  ctx.scale(sc, sc);

  /* Shadow */
  ctx.shadowColor = 'rgba(0,0,0,0.22)';
  ctx.shadowBlur  = 14;
  ctx.shadowOffsetY = 5;

  /* Rounded rect clip */
  const hw = w/2, hh = h/2, rad = 6;
  ctx.beginPath();
  ctx.moveTo(-hw+rad, -hh);
  ctx.lineTo( hw-rad, -hh);
  ctx.quadraticCurveTo(hw,-hh,hw,-hh+rad);
  ctx.lineTo(hw, hh-rad);
  ctx.quadraticCurveTo(hw,hh,hw-rad,hh);
  ctx.lineTo(-hw+rad,hh);
  ctx.quadraticCurveTo(-hw,hh,-hw,hh-rad);
  ctx.lineTo(-hw,-hh+rad);
  ctx.quadraticCurveTo(-hw,-hh,-hw+rad,-hh);
  ctx.closePath();
  ctx.clip();

  /* Image */
  ctx.drawImage(img, -hw, -hh, w, h);

  /* Subtle overlay tint */
  ctx.fillStyle = 'rgba(14,17,13,0.06)';
  ctx.fillRect(-hw,-hh,w,h);

  ctx.restore();
}

let renderScheduled = false;
function renderFrame(){
  if(renderScheduled) return;
  renderScheduled = true;
  requestAnimationFrame(()=>{
    renderScheduled = false;
    _render();
  });
}

let lastPanelIdx = 0, lastT = 0;

function _render(){
  if(!canvasW || !canvasH) return;
  ctx.clearRect(0, 0, canvasW, canvasH);

  const fromIdx = lastPanelIdx;
  const toIdx   = Math.min(fromIdx + 1, PANELS.length - 1);
  const t       = lastT; /* 0=all from, 1=all to */

  const fromLayouts = layoutCache[fromIdx] || [];
  const toLayouts   = layoutCache[toIdx]   || [];
  const fromImgs    = PANELS[fromIdx].imgs;
  const toImgs      = PANELS[toIdx].imgs;

  /* Draw exiting images */
  fromImgs.forEach((imgDef, i) => {
    if(t <= 0) return;
    const img = imgCache[imgDef.url];
    drawImage(img, fromLayouts[i], 1, t, true);
  });

  /* Draw entering images */
  toImgs.forEach((imgDef, i) => {
    if(t >= 1){
      /* Fully landed */
      const img = imgCache[imgDef.url];
      drawImage(img, toLayouts[i], 1, 1, false);
    } else if(t > 0){
      const img = imgCache[imgDef.url];
      drawImage(img, toLayouts[i], 1, t, false);
    }
  });

  /* When not transitioning, just show stable panel */
  if(t <= 0){
    fromImgs.forEach((imgDef, i) => {
      const img = imgCache[imgDef.url];
      drawImage(img, fromLayouts[i], 1, 1, false);
    });
  }
}

/* ══════════════════════════════════════
   SPLIT-FLAP CHARACTER SYSTEM
══════════════════════════════════════ */
const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789%·/-';

/* Build character spans for a target element */
function buildChars(el, text, cls){
  el.innerHTML = '';
  if(cls === 'body'){
    /* Body: word-level for perf, char-level looks too busy */
    text.split(' ').forEach((word, wi) => {
      const span = document.createElement('span');
      span.className = 'fw';
      span.textContent = word;
      el.appendChild(span);
    });
    return;
  }
  /* Char by char */
  [...text].forEach(ch => {
    const span = document.createElement('span');
    span.className = 'fc';
    span.textContent = ch === ' ' ? '\u00A0' : ch;
    if(ch === ' ') span.style.marginRight = '.2em';
    el.appendChild(span);
  });
}

/* Animate characters flip given transition progress t (0→1) */
/* axis: 'X' top-fold, 'Y' side-fold */
/* stagger: spread across [0, staggerEnd] of t */
function animateChars(el, fromText, toText, t, axis, staggerEnd){
  const spans = el.querySelectorAll('.fc');
  const maxLen = Math.max(fromText.length, toText.length);

  spans.forEach((span, i) => {
    const normI = i / Math.max(maxLen - 1, 1);
    /* Each char has a window [start, start+charDur] within t */
    const charDur   = 1 - staggerEnd;
    const charStart = normI * staggerEnd;
    const localT    = Math.max(0, Math.min(1, (t - charStart) / charDur));

    if(localT <= 0){
      /* Not started — show from char */
      span.textContent = fromText[i] || '\u00A0';
      span.style.transform = '';
      span.style.opacity = '1';
      return;
    }

    if(localT >= 1){
      /* Finished — show to char */
      span.textContent = toText[i] || '\u00A0';
      span.style.transform = 'perspective(400px) rotateX(0deg)';
      span.style.opacity = '1';
      return;
    }

    /* In-progress flip */
    /* Phase 1: 0→0.5 fold away, phase 2: 0.5→1 unfold */
    if(localT < 0.5){
      const angle = localT * 2 * 90; /* 0→90 */
      span.textContent = fromText[i] || '\u00A0';
      if(axis === 'Y'){
        span.style.transform = `perspective(300px) rotateY(${angle}deg)`;
      } else {
        span.style.transform = `perspective(300px) rotateX(${-angle}deg)`;
      }
      span.style.opacity = String(Math.max(0.1, 1 - localT * 1.6));
    } else {
      const angle = (1 - localT) * 2 * 90; /* 90→0 */
      /* Cycle through random chars mid-flip for effect */
      const cycleT = (localT - 0.5) * 2; /* 0→1 */
      if(cycleT < 0.6 && toText[i] && toText[i] !== ' '){
        const frameIdx = Math.floor(cycleT * 4) % CHARS.length;
        /* Pick a char that's "between" from and to */
        span.textContent = CHARS[(fromText.charCodeAt(i) + frameIdx * 7) % CHARS.length] || toText[i];
      } else {
        span.textContent = toText[i] || '\u00A0';
      }
      if(axis === 'Y'){
        span.style.transform = `perspective(300px) rotateY(${-angle}deg)`;
      } else {
        span.style.transform = `perspective(300px) rotateX(${angle}deg)`;
      }
      span.style.opacity = String(Math.min(1, (localT - 0.5) * 2.5));
    }
  });
}

/* ══════════════════════════════════════
   SCROLL + STATE
══════════════════════════════════════ */
const outer = document.getElementById('bcOuter');
const fill  = document.getElementById('bcFill');
const curr  = document.getElementById('bcCurr');
const rule  = document.getElementById('bcRule');
const tagEl = document.getElementById('bcTag');
const statEl= document.getElementById('bcStat');
const titEl = document.getElementById('bcTitle');
const bodEl = document.getElementById('bcBody');
const srcEl = document.getElementById('bcSrc');

if(!outer) return;

const N = PANELS.length;
const SCROLL_PER  = window.innerHeight * 1.5;
const FLIP_ZONE   = 0.45;
const AXES        = ['X','Y','X','Y']; /* per transition */

/* Current text state tracked separately */
let builtFor = {tag:'', stat:'', title:''};

/* Build DOM once, animate via JS */
function ensureBuilt(panel){
  if(builtFor.tag !== panel.tag){
    buildChars(tagEl,  panel.tag,   'tag');
    buildChars(statEl, panel.stat,  'stat');
    buildChars(titEl,  panel.title, 'title');
    builtFor = {tag:panel.tag, stat:panel.stat, title:panel.title};
  }
}

function showStable(panelIdx){
  const p = PANELS[panelIdx];
  ensureBuilt(p);
  tagEl.querySelectorAll('.fc').forEach((s,i)=>{s.textContent=p.tag[i]||'\u00A0';s.style.transform='';s.style.opacity='1'});
  statEl.querySelectorAll('.fc').forEach((s,i)=>{s.textContent=p.stat[i]||'\u00A0';s.style.transform='';s.style.opacity='1'});
  titEl.querySelectorAll('.fc').forEach((s,i)=>{s.textContent=p.title[i]||'\u00A0';s.style.transform='';s.style.opacity='1'});
  bodEl.innerHTML = '';
  p.body.split(' ').forEach(w => {
    const sp = document.createElement('span');
    sp.className='fw'; sp.textContent=w; bodEl.appendChild(sp);
  });
  srcEl.textContent = p.src;

  /* Colors */
  applyColors(p.bg);
  rule.style.width = '40px';

  /* Canvas */
  lastPanelIdx = panelIdx;
  lastT = 0;
  renderFrame();
}

function applyColors(bg){
  const dark = bg === '#0D1610';
  document.getElementById('bcSticky').style.background = bg;
  tagEl.style.color   = 'var(--green2)';
  statEl.style.color  = dark ? 'var(--white)' : 'var(--ink)';
  titEl.style.color   = dark ? 'var(--white)' : 'var(--ink)';
  bodEl.style.color   = dark ? 'rgba(245,243,238,.58)' : 'var(--ink3)';
  srcEl.style.color   = dark ? 'rgba(245,243,238,.28)' : 'rgba(14,17,13,.4)';
  rule.style.background = 'var(--green)';
  fill.style.background = 'var(--green2)';
  curr.parentElement.style.color = dark ? 'rgba(245,243,238,.35)' : 'rgba(14,17,13,.4)';
  curr.style.color    = dark ? 'var(--white)' : 'var(--ink)';
}

function doTransition(fromIdx, toIdx, t){
  const from = PANELS[fromIdx];
  const to   = PANELS[toIdx];
  const axis = AXES[toIdx] || 'X';

  /* Colors: flip at midpoint */
  applyColors(t > 0.5 ? to.bg : from.bg);

  /* Rebuild chars from→to if needed */
  if(builtFor.tag !== from.tag){
    buildChars(tagEl,  from.tag,   'tag');
    buildChars(statEl, from.stat,  'stat');
    buildChars(titEl,  from.title, 'title');
    builtFor = {tag:from.tag, stat:from.stat, title:from.title};
  }

  /* Animate each text field with stagger variety */
  animateChars(tagEl,  from.tag,   to.tag,   t, axis,  0.25);
  animateChars(statEl, from.stat,  to.stat,  t, axis === 'X' ? 'Y' : 'X', 0.30); /* different axis for stat */
  animateChars(titEl,  from.title, to.title, t, axis,  0.35);

  /* Body: simple fade crossfade by word */
  const bodySpans = bodEl.querySelectorAll('.fw');
  if(t > 0.55 && bodySpans.length > 0){
    /* Fade existing out */
    bodySpans.forEach(s => { s.style.opacity = String(Math.max(0,(1-(t-0.55)/0.35))); });
  }
  if(t >= 0.55){
    /* Rebuild with new text once */
    if(srcEl.textContent !== to.src){
      bodEl.innerHTML = '';
      to.body.split(' ').forEach((w,wi) => {
        const sp = document.createElement('span');
        sp.className = 'fw';
        sp.textContent = w;
        sp.style.opacity = String(Math.min(1,(t-0.55)/0.35));
        bodEl.appendChild(sp);
      });
      srcEl.textContent = to.src;
    }
  }

  /* Rule width: pulses during transition */
  const ruleW = 40 + Math.sin(t * Math.PI) * 20;
  rule.style.width = ruleW + 'px';

  /* Canvas */
  lastPanelIdx = fromIdx;
  lastT = t;
  renderFrame();
}

function onScroll(){
  if(window.innerWidth < 768) return;

  const scrolled = -outer.getBoundingClientRect().top;
  if(scrolled < 0){ showStable(0); return; }

  const total  = outer.offsetHeight - window.innerHeight;
  const global = Math.min(scrolled / total, 1);

  fill.style.width = (global * 100) + '%';

  const rawPanel  = scrolled / SCROLL_PER;
  const panelIdx  = Math.min(Math.floor(rawPanel), N - 1);
  const frac      = rawPanel - panelIdx; /* 0→1 within slot */

  curr.textContent = String(Math.min(panelIdx + 1, N)).padStart(2,'0');

  if(panelIdx === 0 && frac < FLIP_ZONE){
    showStable(0);
    return;
  }

  if(frac < FLIP_ZONE && panelIdx > 0){
    const t = frac / FLIP_ZONE;
    doTransition(panelIdx - 1, panelIdx, t);
  } else {
    showStable(panelIdx);
  }
}

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
function init(){
  outer.style.height = (N * SCROLL_PER + window.innerHeight) + 'px';
  resizeCanvas();
  showStable(0);
}

init();
window.addEventListener('scroll', onScroll, {passive:true});
window.addEventListener('resize', ()=>{
  outer.style.height = (N * SCROLL_PER + window.innerHeight) + 'px';
  resizeCanvas();
  onScroll();
}, {passive:true});

})();
</script>
</body>
