<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG — {{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;700;800&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg:#ECEAE2; --ink:#0D1610; --green:#2D6B42; --green2:#3D8A57; --stone:#C8C3B5; --body:#4A5548; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  .card { position: relative; width: 1200px; height: 630px; background: var(--bg); color: var(--ink); font-family: 'Urbanist', 'DejaVu Sans', sans-serif; overflow: hidden; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .9; }
  .contours { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .55; }
  .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(236,234,226,.96) 0%, rgba(236,234,226,.9) 55%, rgba(236,234,226,.6) 100%); }
  .inner { position: absolute; inset: 0; padding: 56px 64px 52px; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 34px; height: 34px; }
  .brand span { font-weight: 800; font-size: 20px; letter-spacing: .22em; text-transform: uppercase; }
  .tag { font-family: 'Space Mono', 'DejaVu Sans Mono', monospace; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--green); margin-bottom: 18px; display: flex; align-items: center; gap: 12px; }
  .tag::before { content: ''; width: 22px; height: 2px; background: var(--green); }
  h1 { font-weight: 800; font-size: {{TITLE_SIZE}}px; line-height: 1.02; letter-spacing: -.035em; max-width: 880px; text-wrap: balance; }
  h1 em { font-style: normal; color: var(--green); }
  .foot { display: flex; justify-content: space-between; align-items: flex-end; font-family: 'Space Mono', 'DejaVu Sans Mono', monospace; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--body); }
  .foot b { font-weight: 400; color: var(--ink); }
  .rule { position: absolute; left: 64px; right: 64px; bottom: 104px; height: 1px; background: rgba(13,22,16,.14); }
</style>
</head>
<body>
<div class="card">
  <img class="bg" src="{{BG_SRC}}" alt="" onerror="this.remove()">
  <svg class="contours" viewBox="0 0 1200 630" fill="none" stroke="#2D6B42" stroke-width="1" aria-hidden="true">
    <path d="M820 -40c120 60 90 170 190 230s230 20 300 110" opacity=".35"/>
    <path d="M760 -40c150 90 110 220 230 300s260 40 330 150" opacity=".3"/>
    <path d="M700 -40c180 120 130 270 270 370s290 60 360 190" opacity=".25"/>
    <path d="M640 -40c210 150 150 320 310 440s320 80 390 230" opacity=".2"/>
    <path d="M580 -40c240 180 170 370 350 510s350 100 420 270" opacity=".15"/>
    <path d="M-40 520c120-40 220 10 330 30s200-60 320-30 210 90 330 60" opacity=".22"/>
    <path d="M-40 580c120-40 220 10 330 30s200-60 320-30 210 90 330 60" opacity=".16"/>
  </svg>
  <div class="veil"></div>
  <div class="inner">
    <div class="brand">
      <svg viewBox="30 90 340 235" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M361.78,207.28c5.13,58.78-55.13,92.95-104.46,106.03-52.16,13.84-109.97,9.36-158.44-14.89-28.13-14.14-52.66-40.01-54.67-72.76-1.93-27.64,9.72-54.51,24.88-77.04,14.39-21.2,34.99-38.54,59.16-47.38,42.18-15.78,88.35-7.24,130.64,3.83,53.37,14.34,100.53,40.86,102.89,102.05v.17h0Z" fill="none" stroke="#0D1610" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M321.02,197.81c11.14,65.3-91.48,105.45-143.3,96.47-41.63-6.39-67.99-44.63-77.8-82.84-12.27-41.61,20.46-81.5,59.84-92.24,28.29-8.96,59.78-4.52,86.28,7.76,29.65,14.63,68.91,30.87,74.98,70.85Z" fill="none" stroke="#0D1610" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M278.88,203c-.9,12-9.27,25.3-19.12,34.4-15.51,14.36-36.52,23.05-57.76,24.2-22.86,1.15-44.01-8.83-54-29.92-5.74-12.41-10.57-27.81-8.28-41.48,2.66-16.33,16.88-27.62,31.28-34.12,16.85-7.68,35.85-11.88,54.44-9.48,20.71,2.64,40.9,15.33,48.84,35,2.78,6.87,5.5,9.4,4.6,21.4h0Z" fill="none" stroke="#0D1610" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M252.28,194.62c-.78,8.99-6.66,16.34-14.5,21.5-11.97,7.77-28.52,8.76-41.54,2.93-11.21-4.79-20.29-17.1-16.39-29.46,3.42-10.5,13.59-15.89,23.96-19.28,12.09-3.77,26.07-5.19,36.83,1.94,7.24,4.8,12.41,13.4,11.66,22.18v.18h-.02Z" fill="none" stroke="#0D1610" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="216.48" cy="194.16" r="9" fill="#3D8A57"/>
      </svg>
      <span>Candor</span>
    </div>
    <div>
      <div class="tag">{{TAG}}</div>
      <h1>{{TITLE_HTML}}</h1>
    </div>
    <div class="rule"></div>
    <div class="foot">
      <span><b>candorcertified.com</b>{{PATH}}</span>
      <span>{{DATE}}</span>
    </div>
  </div>
</div>
</body>
</html>
