<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" stroke="#0E110D" stroke-width="6"/>
  <!-- Inner green ring -->
  <circle cx="100" cy="100" r="50" stroke="#2D6B42" stroke-width="6"/>
  <!-- Hour hand (pointing to ~4 o'clock) -->
  <line x1="100" y1="100" x2="134.6" y2="134.6" stroke="#0E110D" stroke-width="6" stroke-linecap="round"/>
  <!-- Minute hand (pointing to ~10 past / 2 o'clock) -->
  <line x1="100" y1="100" x2="100" y2="50" stroke="#0E110D" stroke-width="6" stroke-linecap="round"/>
</svg>
